<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rugby Drill Terminal Simulator</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#101826;
      --panel2:#0e1522;
      --text:#d6e2ff;
      --muted:#8aa0c6;
      --accent:#4da3ff;
      --danger:#ff5a6a;
      --ok:#4dffb8;
      --line:#1d2a44;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: radial-gradient(1200px 600px at 20% 0%, #15223a 0%, var(--bg) 60%);
      color:var(--text);
    }
    header{
      padding:14px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    header .title{
      font-weight:700;
      letter-spacing:.2px;
    }
    header .hint{color:var(--muted); font-size:12px}

    .wrap{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:14px;
      padding:14px;
      height: calc(100vh - 58px);
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      min-height: 0;
    }

    .fieldTop{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,.18);
    }
    .fieldTop .left{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .pill{
      padding:6px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      background: rgba(0,0,0,.25);
    }
    .pill b{color:var(--text)}

    .btn{
      padding:7px 10px;
      border:1px solid var(--line);
      border-radius:10px;
      background: rgba(77,163,255,.12);
      color:var(--text);
      cursor:pointer;
      font-size:12px;
    }
    .btn:hover{border-color: rgba(77,163,255,.5)}
    .btn.danger{background: rgba(255,90,106,.14)}
    .btn.ok{background: rgba(77,255,184,.12)}

    #field{
      width:100%;
      height:100%;
      display:block;
      background: linear-gradient(180deg, #0f1d2d, #09101a);
      touch-action:none;
    }
    .fieldBody{height: calc(100% - 50px);}

    .side{
      display:grid;
      grid-template-rows: auto 1fr;
      gap:14px;
      min-height:0;
    }

    .players{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .players .small{color:var(--muted); font-size:12px}

    .list{
      padding:10px 12px;
      max-height: 160px;
      overflow:auto;
      border-bottom:1px solid var(--line);
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:8px 8px;
      border:1px solid transparent;
      border-radius:10px;
    }
    .row:hover{background: rgba(255,255,255,.03)}
    .row.sel{border-color: rgba(77,163,255,.45); background: rgba(77,163,255,.08)}
    .badge{
      width:14px;height:14px;border-radius:4px;
      border:1px solid rgba(255,255,255,.18);
    }
    .row .meta{display:flex; gap:10px; align-items:center; min-width:0}
    .row .meta span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .row .actions{display:flex; gap:8px; align-items:center}
    .mini{
      padding:5px 8px;
      border:1px solid var(--line);
      border-radius:10px;
      background: rgba(0,0,0,.18);
      color:var(--muted);
      cursor:pointer;
      font-size:12px;
    }
    .mini:hover{color:var(--text)}

    .terminal{
      display:grid;
      grid-template-rows: 1fr auto;
      min-height:0;
    }
    .termOut{
      padding:10px 12px;
      overflow:auto;
      line-height:1.45;
      font-size:13px;
      background: rgba(0,0,0,.20);
      min-height:0;
    }
    .termLine{margin: 0 0 8px 0; white-space:pre-wrap; word-break:break-word}
    .termLine .prompt{color:var(--accent)}
    .termLine .muted{color:var(--muted)}
    .termLine .ok{color:var(--ok)}
    .termLine .bad{color:var(--danger)}

    .termIn{
      display:flex;
      gap:10px;
      padding:10px 12px;
      border-top:1px solid var(--line);
      background: rgba(0,0,0,.22);
    }
    .termIn input{
      flex:1;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background: rgba(10,15,23,.85);
      color:var(--text);
      outline:none;
    }
    .termIn input:focus{border-color: rgba(77,163,255,.6)}

    .k{
      display:inline-block;
      padding:1px 6px;
      border:1px solid rgba(138,160,198,.35);
      border-radius:8px;
      color:var(--muted);
      font-size:12px;
      margin:0 2px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar{height:10px;width:10px}
    ::-webkit-scrollbar-thumb{background:#22314f;border-radius:999px}
    ::-webkit-scrollbar-track{background:#0b0f14}

    @media (max-width: 980px){
      .wrap{grid-template-columns:1fr; height:auto}
      .card{min-height: 420px}
    }
  </style>
</head>
<body>
<header>
  <div>
    <div class="title">Rugby Drill Terminal Simulator</div>
    <div class="hint">Drag players on the pitch. Use terminal commands to record / play / save moves.</div>
  </div>
  <div class="hint">Tips: <span class="k">help</span> <span class="k">add</span> <span class="k">record</span> <span class="k">stop</span> <span class="k">play</span> <span class="k">library</span></div>
</header>

<div class="wrap">
  <!-- Field -->
  <div class="card">
    <div class="fieldTop">
      <div class="left">
        <div class="pill">Selected: <b id="selPill">none</b></div>
        <div class="pill">Mode: <b id="modePill">idle</b></div>
        <div class="pill">Move: <b id="movePill">(unsaved)</b></div>
      </div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="btn ok" id="btnRecord">Record</button>
        <button class="btn" id="btnStop">Stop</button>
        <button class="btn" id="btnPlay">Play</button>
        <button class="btn danger" id="btnReset">Reset Pitch</button>
      </div>
    </div>
    <div class="fieldBody">
      <canvas id="field"></canvas>
    </div>
  </div>

  <!-- Side -->
  <div class="side">
    <div class="card">
      <div class="players">
        <div>
          <div style="font-weight:700">Players</div>
          <div class="small">Click to select. Drag on pitch to move. Color accepts CSS (e.g. <span class="k">#ff0</span>, <span class="k">red</span>).</div>
        </div>
        <button class="btn" id="btnAddQuick">+ Quick Add</button>
      </div>
      <div class="list" id="playerList"></div>
      <div class="terminal" style="height: 380px">
        <div class="termOut" id="termOut"></div>
        <div class="termIn">
          <input id="termInput" type="text" autocomplete="off" spellcheck="false" placeholder="Type a command… (try: help)" />
          <button class="btn" id="btnRun">Run</button>
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileImport" accept="application/json" style="display:none" />

<script>
(() => {
  // ---------------------------
  // Utilities
  // ---------------------------
  const $ = (id) => document.getElementById(id);
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const now = () => performance.now();
  const fmt = (n) => (Number.isFinite(n) ? n.toFixed(0) : String(n));

  function safeJsonParse(str, fallback){
    try { return JSON.parse(str); } catch { return fallback; }
  }

  function downloadJson(filename, data){
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 500);
  }

  // ---------------------------
  // State
  // ---------------------------
  const STORAGE_KEY = 'rugby_drill_terminal_moves_v1';

  /**
   * Player: { id, number, color, x, y, r }
   */
  const state = {
    players: [],
    selectedId: null,

    // recording session (unsaved)
    mode: 'idle', // 'idle' | 'recording' | 'playing'
    currentMoveName: '(unsaved)',
    currentMove: null, // { name, createdAt, durationMs, tracks: { [playerId]: [{t,x,y}] } }
    recordStartT: 0,

    // playback
    playName: null,
    playStartT: 0,
    playDuration: 0,
    playMove: null,

    library: loadLibrary(), // { [name]: move }

    // dragging
    drag: { active:false, pid:null, offX:0, offY:0 },

    // visuals
    dpr: Math.max(1, Math.min(2, window.devicePixelRatio || 1)),
    pitch: { w: 0, h: 0, pad: 26 },

    // command history
    hist: [],
    histIndex: -1,
  };

  function loadLibrary(){
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = safeJsonParse(raw, {});
    if (!parsed || typeof parsed !== 'object') return {};
    return parsed;
  }

  function saveLibrary(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.library));
  }

  function getSelectedPlayer(){
    return state.players.find(p => p.id === state.selectedId) || null;
  }

  function setMode(m){
    state.mode = m;
    $('modePill').textContent = m;
    $('movePill').textContent = state.currentMoveName;
  }

  function setSelected(pid){
    state.selectedId = pid;
    const p = getSelectedPlayer();
    $('selPill').textContent = p ? `#${p.number}` : 'none';
    renderPlayerList();
  }

  function log(line, kind='info'){
    const out = $('termOut');
    const p = document.createElement('div');
    p.className = 'termLine';

    const prefix = document.createElement('span');
    prefix.className = 'prompt';
    prefix.textContent = '› ';
    const msg = document.createElement('span');

    if (kind === 'ok') msg.className = 'ok';
    if (kind === 'bad') msg.className = 'bad';
    if (kind === 'muted') msg.className = 'muted';

    msg.textContent = line;
    p.appendChild(prefix);
    p.appendChild(msg);
    out.appendChild(p);
    out.scrollTop = out.scrollHeight;
  }

  function sys(line){
    const out = $('termOut');
    const p = document.createElement('div');
    p.className = 'termLine';
    const msg = document.createElement('span');
    msg.className = 'muted';
    msg.textContent = line;
    p.appendChild(msg);
    out.appendChild(p);
    out.scrollTop = out.scrollHeight;
  }

  // ---------------------------
  // Canvas / Pitch
  // ---------------------------
  const canvas = $('field');
  const ctx = canvas.getContext('2d');

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    state.pitch.w = Math.floor(rect.width);
    state.pitch.h = Math.floor(rect.height);
    canvas.width = Math.floor(rect.width * state.dpr);
    canvas.height = Math.floor(rect.height * state.dpr);
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  }

  function drawPitch(){
    const {w,h,pad} = state.pitch;

    // Background already handled by CSS; draw pitch markings
    ctx.clearRect(0,0,w,h);

    // Outer lines
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(214,226,255,.20)';
    ctx.strokeRect(pad, pad, w - pad*2, h - pad*2);

    // Halfway line
    ctx.beginPath();
    ctx.moveTo(w/2, pad);
    ctx.lineTo(w/2, h - pad);
    ctx.stroke();

    // 22m-ish lines (approx)
    const a = pad + (w - pad*2) * 0.2;
    const b = pad + (w - pad*2) * 0.8;
    ctx.strokeStyle = 'rgba(214,226,255,.14)';
    ctx.beginPath();
    ctx.moveTo(a, pad);
    ctx.lineTo(a, h - pad);
    ctx.moveTo(b, pad);
    ctx.lineTo(b, h - pad);
    ctx.stroke();

    // Light grid
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(214,226,255,.06)';
    const step = 40;
    for (let x = pad; x <= w-pad; x += step){
      ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, h-pad); ctx.stroke();
    }
    for (let y = pad; y <= h-pad; y += step){
      ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w-pad, y); ctx.stroke();
    }

    // Trails (current recording or last played)
    drawTrails();

    // Players
    for (const p of state.players){
      drawPlayer(p);
    }
  }

  function drawPlayer(p){
    const isSel = p.id === state.selectedId;

    // token
    ctx.beginPath();
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.95;
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // outline
    ctx.lineWidth = isSel ? 3 : 2;
    ctx.strokeStyle = isSel ? 'rgba(77,163,255,.9)' : 'rgba(214,226,255,.18)';
    ctx.stroke();

    // number
    ctx.fillStyle = 'rgba(11,15,20,.95)';
    ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(p.number), p.x, p.y);
  }

  function drawPolyline(points, strokeStyle, width){
    if (!points || points.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
    ctx.restore();
  }

  function drawTrails(){
    // Prefer current recording trail; else show last played move while playing.
    if (state.mode === 'recording' && state.currentMove){
      for (const pid of Object.keys(state.currentMove.tracks)){
        const p = state.players.find(pp => pp.id === pid);
        const color = p?.color || 'rgba(77,163,255,.8)';
        const pts = state.currentMove.tracks[pid].map(s => ({x:s.x, y:s.y}));
        drawPolyline(pts, withAlpha(color, 0.55), 4);
      }
      return;
    }

    if (state.mode === 'playing' && state.playMove){
      // Show full path faint, and "so far" stronger
      const tNow = now() - state.playStartT;
      for (const pid of Object.keys(state.playMove.tracks)){
        const p = state.players.find(pp => pp.id === pid);
        const color = p?.color || 'rgba(77,163,255,.8)';
        const all = state.playMove.tracks[pid];
        const allPts = all.map(s => ({x:s.x, y:s.y}));
        drawPolyline(allPts, withAlpha(color, 0.18), 3);

        const soFar = all.filter(s => s.t <= tNow).map(s => ({x:s.x, y:s.y}));
        drawPolyline(soFar, withAlpha(color, 0.55), 4);
      }
    }
  }

  function withAlpha(cssColor, a){
    // quick & safe: just return rgba white if parsing fails.
    // We'll draw by layering using globalAlpha if needed.
    // For now: use canvas globalAlpha with original color.
    // But we want per-polyline alpha; easiest: set globalAlpha.
    // We'll simulate by returning same color and setting globalAlpha externally? Not in current code.
    // We'll do simple trick: if hex like #rrggbb
    const c = cssColor.trim();
    if (/^#([0-9a-fA-F]{6})$/.test(c)){
      const hex = c.slice(1);
      const r = parseInt(hex.slice(0,2),16);
      const g = parseInt(hex.slice(2,4),16);
      const b = parseInt(hex.slice(4,6),16);
      return `rgba(${r},${g},${b},${a})`;
    }
    if (/^#([0-9a-fA-F]{3})$/.test(c)){
      const hex = c.slice(1);
      const r = parseInt(hex[0]+hex[0],16);
      const g = parseInt(hex[1]+hex[1],16);
      const b = parseInt(hex[2]+hex[2],16);
      return `rgba(${r},${g},${b},${a})`;
    }
    // If it's already rgba/hsla, leave it and rely on user
    return c;
  }

  function posFromEvent(ev){
    const rect = canvas.getBoundingClientRect();
    const x = (ev.clientX - rect.left);
    const y = (ev.clientY - rect.top);
    return {x,y};
  }

  function hitPlayer(x,y){
    // top-most last
    for (let i = state.players.length - 1; i >= 0; i--){
      const p = state.players[i];
      const dx = x - p.x;
      const dy = y - p.y;
      if (dx*dx + dy*dy <= p.r*p.r) return p;
    }
    return null;
  }

  function confineToPitch(p){
    const {w,h,pad} = state.pitch;
    p.x = clamp(p.x, pad, w - pad);
    p.y = clamp(p.y, pad, h - pad);
  }

  // ---------------------------
  // Moves (record / play)
  // ---------------------------
  function startRecording(){
    if (!getSelectedPlayer()){
      log('No player selected. Click a player in the list or on the pitch, then try again.', 'bad');
      return;
    }
    if (state.mode === 'playing') stopPlayback(true);

    state.currentMoveName = '(unsaved)';
    state.currentMove = {
      name: null,
      createdAt: new Date().toISOString(),
      durationMs: 0,
      tracks: {}, // { [pid]: [{t,x,y}] }
    };
    state.recordStartT = now();
    setMode('recording');
    log(`Recording started. Drag players to record trails. Stop with: stop <moveName>`, 'ok');

    // seed selected player point
    seedTrackPoint(getSelectedPlayer().id);
  }

  function seedTrackPoint(pid){
    const p = state.players.find(pp => pp.id === pid);
    if (!p) return;
    if (!state.currentMove.tracks[pid]) state.currentMove.tracks[pid] = [];
    const t = now() - state.recordStartT;
    const arr = state.currentMove.tracks[pid];
    // avoid duplicates
    const last = arr[arr.length - 1];
    if (!last || Math.hypot(last.x - p.x, last.y - p.y) > 0.5){
      arr.push({t, x:p.x, y:p.y});
    }
  }

  function stopRecording(name){
    if (state.mode !== 'recording' || !state.currentMove){
      log('Not currently recording. Use: record', 'bad');
      return;
    }
    const duration = now() - state.recordStartT;
    state.currentMove.durationMs = Math.max(0, Math.floor(duration));

    const moveName = (name || '').trim();
    if (!moveName){
      log('You must provide a name. Example: stop SweepLeft', 'bad');
      return;
    }

    // ensure at least 2 points for selected player
    const anyTracks = Object.keys(state.currentMove.tracks).length;
    if (!anyTracks){
      log('No trail recorded. Drag a player while recording.', 'bad');
      return;
    }

    state.currentMove.name = moveName;
    state.library[moveName] = structuredClone(state.currentMove);
    saveLibrary();

    state.currentMoveName = moveName;
    setMode('idle');
    log(`Saved move "${moveName}" (${fmt(state.currentMove.durationMs)}ms). Use: play ${moveName}`, 'ok');
  }

  function playMove(name){
    const moveName = (name || '').trim();
    if (!moveName){
      log('Provide a move name. Example: play SweepLeft', 'bad');
      return;
    }
    const move = state.library[moveName];
    if (!move){
      log(`No move named "${moveName}" found. Try: library`, 'bad');
      return;
    }

    if (state.mode === 'recording'){
      log('Stop recording before playing. Use: stop <name>', 'bad');
      return;
    }

    // Prepare: set players to first points of their tracks
    for (const pid of Object.keys(move.tracks)){
      const p = state.players.find(pp => pp.id === pid);
      if (!p) continue;
      const first = move.tracks[pid][0];
      if (first){ p.x = first.x; p.y = first.y; confineToPitch(p); }
    }

    state.playMove = structuredClone(move);
    state.playName = moveName;
    state.playDuration = move.durationMs || computeMoveDuration(move);
    state.playStartT = now();
    state.currentMoveName = moveName;
    setMode('playing');
    log(`Playing "${moveName}". Stop with: stopplay`, 'ok');
  }

  function computeMoveDuration(move){
    let maxT = 0;
    for (const pid of Object.keys(move.tracks)){
      const arr = move.tracks[pid];
      if (!arr?.length) continue;
      maxT = Math.max(maxT, arr[arr.length - 1].t);
    }
    return Math.floor(maxT);
  }

  function stopPlayback(silent=false){
    if (state.mode !== 'playing'){
      if (!silent) log('Not currently playing.', 'bad');
      return;
    }
    state.playMove = null;
    state.playName = null;
    state.playDuration = 0;
    setMode('idle');
    if (!silent) log('Playback stopped.', 'ok');
  }

  function stepPlayback(){
    if (state.mode !== 'playing' || !state.playMove) return;
    const tNow = now() - state.playStartT;

    // Set each player position by interpolation
    for (const pid of Object.keys(state.playMove.tracks)){
      const p = state.players.find(pp => pp.id === pid);
      if (!p) continue;
      const track = state.playMove.tracks[pid];
      if (!track || track.length === 0) continue;

      // Find segment
      let i = 0;
      while (i < track.length && track[i].t < tNow) i++;

      if (i <= 0){
        p.x = track[0].x; p.y = track[0].y;
      } else if (i >= track.length){
        const last = track[track.length - 1];
        p.x = last.x; p.y = last.y;
      } else {
        const a = track[i-1];
        const b = track[i];
        const span = Math.max(1, b.t - a.t);
        const u = clamp((tNow - a.t) / span, 0, 1);
        p.x = a.x + (b.x - a.x) * u;
        p.y = a.y + (b.y - a.y) * u;
      }
      confineToPitch(p);
    }

    if (tNow >= state.playDuration + 16){
      stopPlayback(true);
      log('Playback finished.', 'ok');
    }
  }

  // ---------------------------
  // Players
  // ---------------------------
  function addPlayer(number, color){
    const n = Number(number);
    if (!Number.isFinite(n) || n <= 0){
      log('Player number must be a positive integer. Example: add 12 #ffcc00', 'bad');
      return;
    }
    if (state.players.some(p => p.number === n)){
      log(`Player #${n} already exists. Use a different number or delete first.`, 'bad');
      return;
    }
    const {w,h,pad} = state.pitch;
    const p = {
      id: crypto.randomUUID(),
      number: n,
      color: (color || '#4da3ff'),
      x: pad + 40 + Math.random() * (Math.max(0, w - pad*2 - 80)),
      y: pad + 40 + Math.random() * (Math.max(0, h - pad*2 - 80)),
      r: 16,
    };
    confineToPitch(p);
    state.players.push(p);
    setSelected(p.id);
    log(`Added player #${p.number} (${p.color}).`, 'ok');
  }

  function deletePlayer(number){
    const n = Number(number);
    const idx = state.players.findIndex(p => p.number === n);
    if (idx < 0){
      log(`No player #${n}.`, 'bad');
      return;
    }
    const pid = state.players[idx].id;
    state.players.splice(idx, 1);
    if (state.selectedId === pid) setSelected(state.players[0]?.id || null);
    log(`Deleted player #${n}.`, 'ok');
  }

  function setColor(number, color){
    const n = Number(number);
    const p = state.players.find(pp => pp.number === n);
    if (!p){ log(`No player #${n}.`, 'bad'); return; }
    p.color = color || p.color;
    log(`Player #${n} color set to ${p.color}.`, 'ok');
    renderPlayerList();
  }

  function selectPlayer(number){
    const n = Number(number);
    const p = state.players.find(pp => pp.number === n);
    if (!p){ log(`No player #${n}.`, 'bad'); return; }
    setSelected(p.id);
    log(`Selected player #${n}.`, 'ok');
  }

  function resetPitch(){
    if (state.mode === 'recording'){
      log('Stop recording before reset.', 'bad');
      return;
    }
    if (state.mode === 'playing') stopPlayback(true);
    const {w,h,pad} = state.pitch;
    for (const p of state.players){
      p.x = pad + 40 + Math.random() * (Math.max(0, w - pad*2 - 80));
      p.y = pad + 40 + Math.random() * (Math.max(0, h - pad*2 - 80));
      confineToPitch(p);
    }
    state.currentMove = null;
    state.currentMoveName = '(unsaved)';
    setMode('idle');
    log('Pitch reset.', 'ok');
  }

  // ---------------------------
  // Library ops
  // ---------------------------
  function listLibrary(){
    const names = Object.keys(state.library).sort((a,b) => a.localeCompare(b));
    if (names.length === 0){
      log('Library is empty. Record something with: record → stop <name>', 'muted');
      return;
    }
    sys('Library:');
    for (const n of names){
      const m = state.library[n];
      const d = m?.durationMs ?? computeMoveDuration(m);
      sys(`  - ${n}  (${fmt(d)}ms, tracks: ${Object.keys(m.tracks||{}).length})`);
    }
  }

  function deleteMove(name){
    const moveName = (name || '').trim();
    if (!moveName){ log('Provide a move name. Example: del SweepLeft', 'bad'); return; }
    if (!state.library[moveName]){ log(`No move named "${moveName}".`, 'bad'); return; }
    delete state.library[moveName];
    saveLibrary();
    log(`Deleted move "${moveName}".`, 'ok');
  }

  function renameMove(oldName, newName){
    oldName = (oldName||'').trim();
    newName = (newName||'').trim();
    if (!oldName || !newName){
      log('Usage: rename <oldName> <newName>', 'bad');
      return;
    }
    if (!state.library[oldName]){ log(`No move named "${oldName}".`, 'bad'); return; }
    if (state.library[newName]){ log(`"${newName}" already exists.`, 'bad'); return; }
    const m = state.library[oldName];
    delete state.library[oldName];
    m.name = newName;
    state.library[newName] = m;
    saveLibrary();
    log(`Renamed "${oldName}" → "${newName}".`, 'ok');
  }

  function exportLibrary(){
    downloadJson('rugby-moves-library.json', state.library);
    log('Exported library as rugby-moves-library.json', 'ok');
  }

  function importLibraryFromFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      const parsed = safeJsonParse(String(reader.result || ''), null);
      if (!parsed || typeof parsed !== 'object'){
        log('Import failed: invalid JSON.', 'bad');
        return;
      }
      // merge
      let added = 0;
      for (const [name, move] of Object.entries(parsed)){
        if (!name || typeof move !== 'object') continue;
        state.library[name] = move;
        added++;
      }
      saveLibrary();
      log(`Imported ${added} move(s) into library.`, 'ok');
    };
    reader.onerror = () => log('Import failed: could not read file.', 'bad');
    reader.readAsText(file);
  }

  // ---------------------------
  // Terminal commands
  // ---------------------------
  const commands = {
    help: {
      run(){
        sys('Commands:');
        sys('  help                          Show this help');
        sys('  add <number> <color>           Add player (e.g. add 12 #ffcc00)');
        sys('  delplayer <number>             Delete a player');
        sys('  select <number>                Select player');
        sys('  color <number> <color>         Change player color');
        sys('  record                         Start recording (drag players)');
        sys('  stop <moveName>                Stop & save recording');
        sys('  play <moveName>                Play a saved move');
        sys('  stopplay                       Stop playback');
        sys('  library                        List saved moves');
        sys('  del <moveName>                 Delete a move');
        sys('  rename <old> <new>             Rename a move');
        sys('  export                         Download your move library JSON');
        sys('  import                         Import library JSON (merges)');
        sys('  reset                          Reset player positions on pitch');
        sys('  clear                          Clear the terminal output');
        sys('Shortcuts: ↑/↓ for command history');
      }
    },

    add: { run(args){ addPlayer(args[0], args[1]); } },
    delplayer: { run(args){ deletePlayer(args[0]); } },
    select: { run(args){ selectPlayer(args[0]); } },
    color: { run(args){ setColor(args[0], args[1]); } },

    record: { run(){ startRecording(); } },
    stop: { run(args){ stopRecording(args.join(' ')); } },

    play: { run(args){ playMove(args.join(' ')); } },
    stopplay: { run(){ stopPlayback(false); } },

    library: { run(){ listLibrary(); } },
    del: { run(args){ deleteMove(args.join(' ')); } },
    rename: { run(args){ renameMove(args[0], args.slice(1).join(' ')); } },

    export: { run(){ exportLibrary(); } },
    import: { run(){ $('fileImport').click(); } },

    reset: { run(){ resetPitch(); } },
    clear: { run(){ $('termOut').innerHTML=''; sys('Terminal cleared.'); } },
  };

  function runCommand(raw){
    const line = (raw || '').trim();
    if (!line) return;

    // history
    state.hist.push(line);
    state.histIndex = state.hist.length;

    log(line);

    const parts = line.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1);

    const entry = commands[cmd];
    if (!entry){
      log(`Unknown command: ${cmd}. Try: help`, 'bad');
      return;
    }

    try {
      entry.run(args);
    } catch (e){
      log(`Error: ${e?.message || e}`, 'bad');
    }
  }

  // ---------------------------
  // UI: player list
  // ---------------------------
  function renderPlayerList(){
    const list = $('playerList');
    list.innerHTML = '';

    if (state.players.length === 0){
      const empty = document.createElement('div');
      empty.className = 'termLine';
      empty.innerHTML = '<span class="muted">No players yet. Use:</span> <span class="k">add 10 #4da3ff</span>';
      list.appendChild(empty);
      return;
    }

    const sorted = [...state.players].sort((a,b)=>a.number-b.number);
    for (const p of sorted){
      const row = document.createElement('div');
      row.className = 'row' + (p.id === state.selectedId ? ' sel' : '');

      const meta = document.createElement('div');
      meta.className = 'meta';
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.style.background = p.color;

      const label = document.createElement('span');
      label.textContent = `#${p.number}`;

      const small = document.createElement('span');
      small.style.color = 'var(--muted)';
      small.textContent = p.color;

      meta.appendChild(badge);
      meta.appendChild(label);
      meta.appendChild(small);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const selBtn = document.createElement('button');
      selBtn.className = 'mini';
      selBtn.textContent = 'Select';
      selBtn.onclick = () => setSelected(p.id);
      const delBtn = document.createElement('button');
      delBtn.className = 'mini';
      delBtn.textContent = 'Delete';
      delBtn.onclick = () => deletePlayer(p.number);
      actions.appendChild(selBtn);
      actions.appendChild(delBtn);

      row.appendChild(meta);
      row.appendChild(actions);
      row.onclick = (ev) => {
        if (ev.target === selBtn || ev.target === delBtn) return;
        setSelected(p.id);
      };

      list.appendChild(row);
    }
  }

  // ---------------------------
  // Interaction: drag / record
  // ---------------------------
  function onPointerDown(ev){
    if (state.mode === 'playing') return; // don't drag during playback

    canvas.setPointerCapture(ev.pointerId);
    const {x,y} = posFromEvent(ev);
    const hit = hitPlayer(x,y);
    if (!hit) return;

    setSelected(hit.id);
    state.drag.active = true;
    state.drag.pid = hit.id;
    state.drag.offX = x - hit.x;
    state.drag.offY = y - hit.y;

    if (state.mode === 'recording') seedTrackPoint(hit.id);
  }

  function onPointerMove(ev){
    if (!state.drag.active) return;
    const p = state.players.find(pp => pp.id === state.drag.pid);
    if (!p) return;

    const {x,y} = posFromEvent(ev);
    p.x = x - state.drag.offX;
    p.y = y - state.drag.offY;
    confineToPitch(p);

    if (state.mode === 'recording'){
      seedTrackPoint(p.id);
    }
  }

  function onPointerUp(ev){
    if (!state.drag.active) return;
    state.drag.active = false;
    state.drag.pid = null;
  }

  // ---------------------------
  // Main loop
  // ---------------------------
  function frame(){
    stepPlayback();
    drawPitch();
    requestAnimationFrame(frame);
  }

  // ---------------------------
  // Buttons & terminal input
  // ---------------------------
  $('btnRun').onclick = () => {
    const inp = $('termInput');
    runCommand(inp.value);
    inp.value = '';
    inp.focus();
  };

  $('termInput').addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter'){
      $('btnRun').click();
      ev.preventDefault();
      return;
    }
    if (ev.key === 'ArrowUp'){
      ev.preventDefault();
      if (state.hist.length === 0) return;
      state.histIndex = Math.max(0, state.histIndex - 1);
      $('termInput').value = state.hist[state.histIndex] || '';
      return;
    }
    if (ev.key === 'ArrowDown'){
      ev.preventDefault();
      if (state.hist.length === 0) return;
      state.histIndex = Math.min(state.hist.length, state.histIndex + 1);
      $('termInput').value = state.hist[state.histIndex] || '';
      return;
    }
  });

  $('btnRecord').onclick = () => runCommand('record');
  $('btnStop').onclick = () => {
    if (state.mode === 'recording'){
      const name = prompt('Name this move:', 'MyMove');
      if (name !== null) runCommand('stop ' + name);
      return;
    }
    if (state.mode === 'playing') return runCommand('stopplay');
    log('Nothing to stop. Use: record OR play <name>', 'muted');
  };
  $('btnPlay').onclick = () => {
    const name = prompt('Play which move? (see: library)', '');
    if (name !== null) runCommand('play ' + name);
  };
  $('btnReset').onclick = () => runCommand('reset');

  $('btnAddQuick').onclick = () => {
    const num = prompt('Player number:', '10');
    if (num === null) return;
    const color = prompt('Player color (CSS):', '#4da3ff');
    if (color === null) return;
    runCommand(`add ${num} ${color}`);
  };

  $('fileImport').addEventListener('change', (ev) => {
    const f = ev.target.files?.[0];
    if (f) importLibraryFromFile(f);
    ev.target.value = '';
  });

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  window.addEventListener('resize', () => {
    resizeCanvas();
  });

  // ---------------------------
  // Boot
  // ---------------------------
  function boot(){
    resizeCanvas();
    renderPlayerList();

    // starter players
    addPlayer(10, '#4da3ff');
    addPlayer(12, '#ffcc00');
    addPlayer(13, '#ff5a6a');

    sys('Welcome. This is a single-file HTML app (no server needed).');
    sys('Try: help');
    sys('Workflow: add players → select → record → drag players → stop <name> → play <name>');

    requestAnimationFrame(frame);
  }

  boot();
})();
</script>
</body>
</html>
